; ASTRA dialplan.
;
; 700 -> the assistant, over AudioSocket. The second argument is host:port of the
;        gateway (`assistant --sip`). AudioSocket requires a real UUID and
;        rejects anything else with "Failed to parse UUID" — ${UNIQUEID} is not
;        one, so use ${UUID()} from func_uuid.so.
; 701 -> echo test, kept for diagnosing audio without involving the assistant.
[assistant-test]
exten => 700,1,NoOp(ASTRA call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(AS_UUID=${UUID()})
 same => n,AudioSocket(${AS_UUID},127.0.0.1:8090)
 same => n,Hangup()

exten => 701,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()
