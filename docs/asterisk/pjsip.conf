; ASTRA — LAN-only SIP endpoint for the Nothing Phone 3a dialer.
; Do NOT expose port 5060 to the internet.
;
; The endpoint and AOR intentionally share the registration user name `700`.
; Asterisk sorcery distinguishes them by `type=` and the registrar looks up the
; AOR from the SIP To-header user.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[700]
type=endpoint
context=assistant-test
disallow=all
; No opus codec module is built here, so advertising opus lets the phone
; negotiate it — and then AudioSocket cannot convert slin back to opus
; ("Unable to find a codec translation path: (slin) -> (opus)") and the
; call drops instantly. ulaw/alaw translate to slin natively.
allow=ulaw,alaw
auth=700-auth
aors=700
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[700-auth]
type=auth
auth_type=userpass
username=700
password=CHANGE_ME

[700]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
